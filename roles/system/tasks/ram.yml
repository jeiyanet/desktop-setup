# Debian: zram-tools
- name: Install zram-tools
  ansible.builtin.apt:
    name: zram-tools
  when: ansible_os_family == "Debian"

# openSUSE: zswap (kernel built-in, backed by your LVM swap partition)
- name: Enable zswap
  ansible.builtin.sysctl:
    name: vm.zswap.enabled
    value: "1"
    state: present
    reload: true
  when: ansible_os_family == "Suse"

# Shared: tune swappiness
- name: Change swappiness value to 10
  ansible.builtin.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: true
